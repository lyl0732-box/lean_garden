<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'"><title>登录证明花园</title>
<style>*{box-sizing:border-box;scrollbar-width:none}::-webkit-scrollbar{display:none}body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px/1.7 'Microsoft YaHei',sans-serif;color:#4e6746;background:radial-gradient(at 50% 25%,#fff9df,#dce9c8 65%,#bfd8aa)}main{width:min(610px,94vw);margin:24px;padding:25px 38px;background:#fffbeded;border:2px solid #a4b984;border-radius:28px;box-shadow:0 12px 45px #607b3833}header{display:flex;align-items:center;justify-content:center;gap:18px}img{width:80px}small{color:#8b9c70}h1{font-family:KaiTi,serif;font-size:34px;margin:0}p{font-size:12px;color:#8a9676;margin:5px 0}.tabs{display:flex;gap:8px;margin:20px 0 12px}.tabs button{flex:1;background:#e3e9d2;color:#61794f;box-shadow:none;padding:9px;margin:0}.tabs button[aria-selected=true]{background:#65884b;color:#fffbed}label{display:block;font-size:12px;margin:12px 0 5px}label small{float:right}input,select{width:100%;padding:11px;border:2px solid #b2c59c;border-radius:12px;color:#4f6844;background:#fffdf4;font:15px 'Microsoft YaHei',sans-serif}button{border:0;border-radius:12px;background:#65884b;box-shadow:0 4px #3f6132;color:#fff7d7;padding:13px;width:100%;font:inherit;font-weight:bold;margin:18px 0 12px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}#message{color:#a26550;font-size:12px;min-height:20px}.link{padding:0;background:none;color:#71835b;box-shadow:none;font-size:12px;width:auto;margin:0}footer{font-size:11px;color:#98a382;margin-top:10px;text-align:center}.over{color:#b04f48}body{background:linear-gradient(120deg,#163d3950,#6b966a20),url('portal-world.webp') center/cover fixed}main{background:#fffbedec;backdrop-filter:blur(14px);border-color:#e3dfb3;box-shadow:0 7px #53745055,0 30px 100px #122d3c66}.portal-tools{position:fixed;right:25px;top:20px;display:flex;gap:8px;z-index:5}.portal-tools button{width:auto;margin:0;padding:10px 16px;font-size:12px;background:#fff6dc;color:#527249;border:1px solid #a9b77f;min-width:80px;white-space:nowrap}.remember-row{display:flex;align-items:center;gap:9px;margin:15px 0 0}.remember-row input{width:17px;height:17px;accent-color:#648b4c}body{padding-top:55px}main{margin:20px}@media(max-height:720px){main{padding:18px 35px;width:740px;max-width:95vw}header img{width:60px}.tabs{margin:12px 0}label{margin:8px 0 4px}input,select{padding:9px}button{margin-top:12px}}</style>
<div class="portal-tools"><button type="button" id="check-update">检查更新</button><button type="button" id="portal-fullscreen">退出全屏</button><button type="button" id="portal-exit">退出</button></div><main><header><img src="icon.png" alt="花园小芽"><div><small>THE LEAN GARDEN</small><h1>证明花园</h1><p>一张小卡，打开整个数学世界。</p></div></header><div class="tabs"><button type="button" data-mode="login" aria-selected="true">登录花园</button><button type="button" data-mode="register" aria-selected="false">注册新账号</button></div><form><label for="server">花园地址</label><input id="server" type="url" required value="https://162.14.77.140" autocomplete="url"><div class="row"><div><label for="username">用户名 <small id="bytes">0 / 30 字节</small></label><input id="username" maxlength="30" autocomplete="username" required></div><div id="password-row"><label for="password">密码 · 至少 6 个字符</label><input id="password" type="password" minlength="6" maxlength="128" autocomplete="current-password" required></div></div><div id="hint-row" hidden><label for="hint">忘记密码提示词 · 可选，请勿直接填写密码</label><input id="hint" maxlength="80" autocomplete="off"></div><label for="quality">画面清晰度</label><select id="quality"><option value="high">清晰画面（最高）</option><option value="low">流畅省流</option></select><label class="remember-row" id="remember-row"><input id="remember" type="checkbox">记住密码 · 仅保存在本机</label><button id="submit">登录 · 进入花园 →</button></form><button type="button" class="link" id="forgot">忘记密码？看看提示词</button><div id="message" role="alert"></div><footer>勾选后，密码使用 Windows 系统加密保存。<br>F11 切换全屏 · 插图与音乐随包内置，更新只下载变动部分。</footer></main>
<script>
const $=id=>document.getElementById(id);let mode='login',pending=false;
gardenConnection.read().then(s=>{$('server').value=s.serverURL;$('quality').value=s.quality;$('username').value=s.username||'';$('remember').checked=!!s.remember;$('password').value=s.password||'';count();});
function count(){const n=new TextEncoder().encode($('username').value.trim().normalize('NFC')).length;$('bytes').textContent=n+' / 30 字节';$('bytes').classList.toggle('over',n>30);} $('username').addEventListener('input',count);
function setMode(next){if(pending)return;mode=next;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===mode)));$('password-row').hidden=mode==='hint';$('remember-row').hidden=mode!=='login';if(mode==='register'){$('password').value='';$('remember').checked=false;}$('password').required=mode!=='hint';$('password').autocomplete=mode==='register'?'new-password':'current-password';$('hint-row').hidden=mode!=='register';$('submit').textContent=mode==='hint'?'看看我的提示词':mode==='register'?'注册 · 进入花园 →':'登录 · 进入花园 →';$('message').textContent='';}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('forgot').onclick=()=>setMode('hint');
document.querySelector('form').onsubmit=async event=>{event.preventDefault();if(pending)return;try{const username=$('username').value.trim().normalize('NFC');if(!username||new TextEncoder().encode(username).length>30)throw new Error('用户名须为 1–30 字节（一个汉字通常占 3 字节）。');pending=true;$('submit').disabled=true;$('message').textContent=mode==='hint'?'正在寻找线索…':'正在验证账号…';const value={mode,serverURL:$('server').value,quality:$('quality').value,username,password:$('password').value,recoveryHint:$('hint').value,adoptLegacy:true,remember:$('remember').checked};if(mode==='hint'){$('message').textContent=(await gardenConnection.auth(value)).hint;}else await gardenConnection.open(value);}catch(error){$('message').textContent=error.message;}finally{pending=false;$('submit').disabled=false;}};
$('portal-exit').onclick=()=>gardenConnection.exit();
const syncFullscreen=on=>$('portal-fullscreen').textContent=on?'退出全屏':'全屏';gardenWindow.isFullscreen().then(syncFullscreen);gardenWindow.onChange(syncFullscreen);$('portal-fullscreen').onclick=async()=>syncFullscreen(await gardenWindow.toggle());
$('remember').onchange=()=>{if(!$('remember').checked)void gardenConnection.forget();};
$('server').addEventListener('input',()=>{$('password').value='';$('remember').checked=false;});
$('check-update').onclick=async()=>{if(pending)return;pending=true;$('submit').disabled=true;$('check-update').disabled=true;try{const r=await gardenConnection.check({serverURL:$('server').value});$('message').textContent='已更新至 '+r.revision+' · 新下载 '+r.downloaded+' 项 · 下次登录即可使用';}catch(e){$('message').textContent=e.message;}finally{pending=false;$('submit').disabled=false;$('check-update').disabled=false;}};
gardenConnection.onUpdate(p=>{$('message').textContent=`检查更新 ${p.ready}/${p.total} · 内置 ${p.bundled} · 已缓存 ${p.cached} · 新下载 ${p.downloaded}`;});
</script></html>
